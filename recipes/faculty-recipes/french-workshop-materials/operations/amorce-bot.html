<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amorces FR30 — Boucar Diouf</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #f9f6f1;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      color: #444;
    }

    header p {
      font-size: 0.85rem;
      color: #888;
      margin-top: 0.4rem;
      font-style: italic;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .controls button {
      padding: 0.45rem 1rem;
      font-size: 0.8rem;
      font-family: Georgia, serif;
      border: 1px solid #ccc;
      background: #fff;
      color: #444;
      border-radius: 2rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .controls button:hover,
    .controls button.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .card {
      background: #fff;
      border: 1px solid #e0dbd3;
      border-radius: 6px;
      padding: 2rem 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    .grammar-tag {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 1.25rem;
    }

    .insight {
      font-size: 1rem;
      line-height: 1.75;
      color: #333;
      margin-bottom: 1.75rem;
    }

    .amorce {
      font-size: 1.15rem;
      font-style: italic;
      color: #1a1a1a;
      border-left: 3px solid #1a1a1a;
      padding-left: 1rem;
      line-height: 1.5;
    }

    .next-btn {
      display: block;
      margin: 2rem auto 0;
      padding: 0.65rem 2rem;
      font-size: 0.9rem;
      font-family: Georgia, serif;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.15s;
    }

    .next-btn:hover { opacity: 0.75; }

    footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Amorces FR30</h1>
  <p>D'après <em>Déconnecter</em> de Boucar Diouf</p>
</header>

<div class="controls">
  <button class="active" data-grammar="all">Toutes</button>
  <button data-grammar="subjonctif">Subjonctif présent</button>
  <button data-grammar="passe">Imparfait / passé composé</button>
  <button data-grammar="discours_indirect">Discours indirect</button>
  <button data-grammar="plus_que_parfait">Plus-que-parfait</button>
</div>

<div class="card">
  <div class="grammar-tag" id="grammar-tag"></div>
  <p class="insight" id="insight"></p>
  <p class="amorce" id="amorce"></p>
</div>

<button class="next-btn" id="next-btn">Nouvelle amorce →</button>

<footer>Appuie sur « Nouvelle amorce » pour une autre invitation à écrire.</footer>

  // ── Imparfait / passé composé ─────────────────────────────────────────
  {

    grammar: "passe",

let currentGrammar = "all";
let lastIndex = -1;

function getPool() {
  return currentGrammar === "all"
    ? AMORCES
    : AMORCES.filter(a => a.grammar === currentGrammar);
}

function pick() {
  const pool = getPool();
  let idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (pool.length > 1 && idx === lastIndex);
  lastIndex = idx;
  return pool[idx];
}

function render() {
  const entry = pick();
  document.getElementById("grammar-tag").textContent = entry.label;
  document.getElementById("insight").textContent = entry.insight;
  document.getElementById("amorce").textContent = entry.amorce;
}

// filter buttons
document.querySelectorAll(".controls button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".controls button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentGrammar = btn.dataset.grammar;
    lastIndex = -1;
    render();
  });
});

document.getElementById("next-btn").addEventListener("click", render);

render();
</script>
</body>
</html>
