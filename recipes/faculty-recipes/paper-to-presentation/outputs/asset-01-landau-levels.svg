<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: 600; fill: #ffffff; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #ffffff; }
      .value { font-family: 'SF Mono', Monaco, monospace; font-size: 16px; fill: #ffffff; }
      .annotation { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #b3b3b3; }
    </style>
  </defs>

  <!-- Dark background -->
  <rect width="1000" height="600" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle">Landau Level Quantization</text>

  <!-- LEFT PANEL: 2D Electron Gas -->
  <g>
    <!-- Sample region -->
    <rect x="60" y="80" width="220" height="200" fill="none" stroke="#666666" stroke-width="2" rx="4"/>

    <!-- Magnetic field symbols -->
    <circle cx="120" cy="130" r="10" fill="none" stroke="#FF9500" stroke-width="2.5"/>
    <circle cx="120" cy="130" r="3" fill="#FF9500"/>

    <circle cx="170" cy="110" r="10" fill="none" stroke="#FF9500" stroke-width="2.5"/>
    <circle cx="170" cy="110" r="3" fill="#FF9500"/>

    <circle cx="130" cy="210" r="10" fill="none" stroke="#FF9500" stroke-width="2.5"/>
    <circle cx="130" cy="210" r="3" fill="#FF9500"/>

    <!-- Field label -->
    <text x="175" y="265" class="label">B field (⊙)</text>
    <text x="175" y="290" class="annotation">perpendicular to plane</text>
  </g>

  <!-- MIDDLE PANEL: Energy Levels -->
  <g>
    <!-- Energy axis -->
    <line x1="380" y1="280" x2="380" y2="80" stroke="#666666" stroke-width="2"/>
    <polygon points="380,70 375,85 385,85" fill="#666666"/>
    <text x="355" y="90" class="label">E</text>

    <!-- Landau levels as thick bands -->
    <!-- LL2 -->
    <rect x="420" y="95" width="100" height="35" fill="#FF9500" opacity="0.3" stroke="#FF9500" stroke-width="2" rx="3"/>
    <text x="470" y="120" class="label" text-anchor="middle">LL₂</text>

    <!-- LL1 -->
    <rect x="420" y="155" width="100" height="35" fill="#FF9500" opacity="0.5" stroke="#FF9500" stroke-width="2" rx="3"/>
    <text x="470" y="180" class="label" text-anchor="middle">LL₁</text>

    <!-- LL0 -->
    <rect x="420" y="215" width="100" height="35" fill="#FF9500" stroke="#FF9500" stroke-width="2" rx="3"/>
    <text x="470" y="240" class="label" text-anchor="middle">LL₀</text>

    <!-- Degeneracy label -->
    <text x="540" y="180" class="annotation">Degeneracy</text>
    <text x="540" y="200" class="annotation">= N<tspan font-size="12" baseline-shift="sub">φ</tspan></text>
  </g>

  <!-- RIGHT PANEL: States in One Level -->
  <g>
    <!-- Container -->
    <rect x="680" y="80" width="240" height="200" fill="none" stroke="#666666" stroke-width="2" rx="4"/>

    <!-- Grid of orbital states -->
    <g opacity="0.8">
      <!-- Row 1 -->
      <circle cx="710" cy="120" r="8" fill="#FF9500"/>
      <circle cx="750" cy="120" r="8" fill="#FF9500"/>
      <circle cx="790" cy="120" r="8" fill="#FF9500"/>
      <circle cx="830" cy="120" r="8" fill="#FF9500"/>
      <circle cx="870" cy="120" r="8" fill="#FF9500"/>

      <!-- Row 2 -->
      <circle cx="710" cy="160" r="8" fill="#FF9500"/>
      <circle cx="750" cy="160" r="8" fill="#FF9500"/>
      <circle cx="790" cy="160" r="8" fill="#FF9500"/>
      <circle cx="830" cy="160" r="8" fill="#FF9500"/>
      <circle cx="870" cy="160" r="8" fill="#FF9500"/>

      <!-- Row 3 -->
      <circle cx="710" cy="200" r="8" fill="#FF9500"/>
      <circle cx="750" cy="200" r="8" fill="#FF9500"/>
      <circle cx="790" cy="200" r="8" fill="#FF9500"/>
      <text x="850" y="210" class="annotation">...</text>
    </g>

    <text x="800" y="260" class="label" text-anchor="middle">N<tspan font-size="14" baseline-shift="sub">φ</tspan> states</text>
    <text x="800" y="280" class="annotation" text-anchor="middle">per Landau level</text>
  </g>

  <!-- BOTTOM: Filling Factor -->
  <rect x="100" y="330" width="800" height="100" fill="#FF9500" opacity="0.15" stroke="#FF9500" stroke-width="2" rx="6"/>

  <text x="500" y="365" class="label" text-anchor="middle" font-size="22">Filling Factor: ν = N<tspan font-size="16" baseline-shift="sub">e</tspan> / N<tspan font-size="16" baseline-shift="sub">φ</tspan></text>
  <text x="500" y="400" class="annotation" text-anchor="middle" font-size="16">At ν = 1/2: one electron per two flux quanta</text>
  <text x="500" y="425" class="annotation" text-anchor="middle" font-size="16">Half of available orbital states are occupied</text>
</svg>
